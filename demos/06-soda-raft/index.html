<h1>💨 汽水木筏 Soda Raft</h1>
<div class="sub">两只青蛙共乘一条木筏，靠摇晃汽水瓶的“汽水喷射”逆流而上！左侧喷口 <kbd>A</kbd>，右侧喷口 <kbd>L</kbd>（适合两人合作，各管一边）。单人可用 <kbd>←</kbd><kbd>→</kbd> 转向、<kbd>↑</kbd> 双喷。只喷一侧会转弯，两侧同时喷才直行。捡 🥤 补充汽水，撞石头掉血。到达终点旗帜获胜！</div>
