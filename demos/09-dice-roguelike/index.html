<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>骰运连连 Dice Gambit</title>
<link rel="stylesheet" href="../../shared/xg.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #12301f url(../../assets/09-dice-roguelike/felt.webp) center / cover fixed; color: #f5f1e3; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; min-height: 100vh; }
  .wrap { max-width: 980px; margin: auto; padding: 50px 10px 16px; }
  .bar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 4px 0; }
  .chip { background: #000a; border-radius: 10px; padding: 6px 12px; font-size: 14px; }
  .chip b { color: #ffd76b; }
  #boss { text-align: center; min-height: 22px; color: #ff9a8a; font-weight: 800; font-size: 14px; }
  #dice { display: flex; gap: 12px; justify-content: center; margin: 14px 0 6px; flex-wrap: wrap; }
  .die { width: 80px; height: 80px; border-radius: 16px; background: linear-gradient(145deg, #fffdf6, #e9e1cc); color: #222; font-size: 60px; line-height: 80px; text-align: center; cursor: pointer; user-select: none; box-shadow: 0 6px 0 #a89c80, 0 10px 20px #0006; transition: transform .1s; touch-action: manipulation; }
  .die.held { background: linear-gradient(145deg, #ffe27a, #f0b93a); transform: translateY(-8px); box-shadow: 0 10px 0 #b38b1f, 0 14px 20px #0006; }
  .die.banned { opacity: .45; }
  .die.rolling { animation: wob .3s; }
  @keyframes wob { 0% { transform: rotate(-20deg) scale(.9) } 50% { transform: rotate(15deg) } 100% { transform: rotate(0) } }
  #preview { text-align: center; font-size: 18px; min-height: 28px; background: #0008; border-radius: 10px; padding: 6px; max-width: 560px; margin: 6px auto; }
  #preview b { color: #7fd8ff; } #preview i { color: #ff8a7a; font-style: normal; font-weight: 800; }
  .btns { display: flex; gap: 10px; justify-content: center; margin: 8px 0; flex-wrap: wrap; }
  button { padding: 10px 18px; border: 0; border-radius: 10px; background: #ffd76b; color: #222; font-weight: 800; cursor: pointer; font-size: 15px; touch-action: manipulation; }
  button.blue { background: #7fd8ff; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  h3 { margin: 12px 0 6px; font-size: 15px; color: #ffd76b; text-shadow: 0 1px 3px #000; }
  .charms { display: flex; gap: 8px; flex-wrap: wrap; }
  .charm { background: #000b; border: 1px solid #ffd76b55; border-radius: 10px; padding: 8px; width: 172px; font-size: 13px; }
  .charm .n { font-weight: 800; color: #ffd76b; }
  .charm.rare .n { color: #ff9af0; }
  .charm button { margin-top: 6px; padding: 5px 10px; font-size: 13px; }
  #log { font-size: 14px; min-height: 22px; text-align: center; text-shadow: 0 1px 3px #000; }
  #shop { display: none; background: #000c; border-radius: 14px; padding: 12px; margin-top: 10px; }
  table { font-size: 12px; border-collapse: collapse; margin: auto; background: #0008; border-radius: 8px; }
  td { padding: 3px 10px; border-bottom: 1px solid #ffffff14; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="chip">轮次 <b id="round"></b></div>
    <div class="chip">目标 <b id="target"></b></div>
    <div class="chip">当前 <b id="score"></b></div>
    <div class="chip">出手 <b id="hands"></b></div>
    <div class="chip">重掷 <b id="rerolls"></b></div>
    <div class="chip">💰 <b id="money"></b></div>
  </div>
  <div id="boss"></div>
  <div id="dice"></div>
  <div id="preview"></div>
  <div class="btns"><button id="bReroll" class="blue">🔄 重掷未锁定 (R)</button><button id="bScore">✅ 计分出手 (Enter)</button></div>
  <div id="log"></div>
  <div id="shop">
    <h3>🛍️ 商店（护符最多 5 个，符咒最多 2 个）</h3>
    <div class="charms" id="shopItems"></div>
    <div class="btns"><button id="bReshop" class="blue">🔁 刷新 $2</button><button id="bNext">➡️ 下一轮</button></div>
  </div>
  <h3>🧿 我的护符</h3><div class="charms" id="mine"></div>
  <h3>📜 我的符咒（一次性，点击使用）</h3><div class="charms" id="spells"></div>
  <h3>📖 牌型表</h3><table id="table"></table>
</div>
<script src="../../shared/xg.js"></script>
<script src="game.js"></script>
</body>
</html>
