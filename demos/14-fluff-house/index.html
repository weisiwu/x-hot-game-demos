<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>毛球小屋 Fluff House</title>
<link rel="stylesheet" href="../../shared/xg.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(circle at 50% 0, #4a2f3a, #1c1218 70%); color: #fff4ec; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; min-height: 100vh; }
  #wrap { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: flex-start; padding: 50px 6px 10px; }
  canvas { border-radius: 14px; touch-action: manipulation; display: block; box-shadow: 0 8px 30px #000a; cursor: pointer; }
  #side { width: 280px; background: #2c1d25e8; border-radius: 12px; padding: 10px; font-size: 13px; }
  #side h3 { margin: 8px 0 4px; font-size: 14px; color: #ffcf7a; }
  .row { display: flex; justify-content: space-between; margin: 2px 0; } .row b { color: #ffcf7a; }
  #reqs div { background: #00000040; border-radius: 8px; padding: 6px 8px; margin: 3px 0; }
  #reqs div.done { background: #3a6a3a80; text-decoration: line-through; opacity: .8; }
  #shop { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  #shop button, #side .wide { border: 0; border-radius: 8px; padding: 6px; background: #5a3a48; color: #fff; cursor: pointer; font-size: 12px; text-align: left; touch-action: manipulation; }
  #shop button.sel { outline: 2px solid #ffcf7a; background: #7a4a5e; }
  #shop button:disabled { opacity: .4; }
  #side .wide { width: 100%; margin-top: 6px; text-align: center; }
  #hint { font-size: 12px; opacity: .8; min-height: 32px; margin-top: 6px; line-height: 1.4; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="900" height="600"></canvas>
  <div id="side">
    <div class="row"><span>📅 第</span><b id="day"></b></div>
    <div class="row"><span>⏳ 剩余时间</span><b id="time"></b></div>
    <div class="row"><span>🍓 莓果</span><b id="berries"></b></div>
    <div class="row"><span>🐾 来访毛球</span><b id="guests"></b></div>
    <h3>📋 今日委托（完成 2 个即过关）</h3>
    <div id="reqs"></div>
    <h3>🛒 家具（选中后点空位摆放）</h3>
    <div id="shop"></div>
    <button class="wide" id="bAlbum">📔 图鉴</button>
    <div id="hint"></div>
  </div>
</div>
<script src="../../shared/xg.js"></script>
<script src="game.js"></script>
</body>
</html>
