<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>01 · 草堆寻针 Haystack Hunt</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #2b2116; color: #f6ead2; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; display: flex; flex-direction: column; align-items: center; }
  h1 { margin: 12px 0 4px; font-size: 22px; }
  .sub { opacity: .75; font-size: 13px; margin-bottom: 8px; }
  #wrap { display: flex; gap: 12px; align-items: flex-start; }
  canvas { background: #5a4329; border-radius: 10px; cursor: crosshair; touch-action: none; max-width: 100%; }
  #side { width: 230px; background: #3a2c1d; padding: 12px; border-radius: 10px; font-size: 14px; }
  #side button { width: 100%; margin: 4px 0; padding: 8px; border: 0; border-radius: 6px; background: #d9a441; color: #2b2116; font-weight: 700; cursor: pointer; }
  #side button:disabled { background: #6b5a40; color: #b9a98a; cursor: not-allowed; }
  .stat { display: flex; justify-content: space-between; margin: 3px 0; }
  #meter { height: 14px; background: #221a10; border-radius: 7px; overflow: hidden; margin: 6px 0; }
  #meterFill { height: 100%; width: 0; background: linear-gradient(90deg, #4aa3ff, #ff4a4a); transition: width .1s; }
  #msg { min-height: 40px; color: #ffd68a; margin-top: 6px; }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center; }
  #overlay div { background: #3a2c1d; padding: 24px 32px; border-radius: 12px; text-align: center; max-width: 420px; }
  #overlay button { margin-top: 12px; padding: 10px 20px; border: 0; border-radius: 8px; background: #d9a441; font-weight: 700; cursor: pointer; }
  a { color: #ffd68a; }
</style>
</head>
<body>
<h1>🪡 草堆寻针 Haystack Hunt</h1>
<div class="sub">按住鼠标拖动拨开稻草，看到银色的针后<b>点击它</b>。拨开的稻草换成金币买工具。共 3 个草堆。</div>
<div id="wrap">
  <canvas id="c" width="900" height="560"></canvas>
  <div id="side">
    <div class="stat"><span>草堆</span><b id="lvl">1 / 3</b></div>
    <div class="stat"><span>剩余稻草</span><b id="left">0</b></div>
    <div class="stat"><span>金币</span><b id="coins">0</b></div>
    <div class="stat"><span>用时</span><b id="time">0.0s</b></div>
    <div id="detWrap" style="display:none">
      <div style="margin-top:8px">📡 金属探测器（鼠标离针越近越红）</div>
      <div id="meter"><div id="meterFill"></div></div>
    </div>
    <hr style="border-color:#5a4329">
    <button id="bRadius"></button>
    <button id="bPower"></button>
    <button id="bDetector"></button>
    <button id="bMagnet"></button>
    <div id="msg"></div>
    <div style="font-size:12px;opacity:.7;margin-top:8px"><a href="../../index.html">← 返回目录</a></div>
  </div>
</div>
<div id="overlay"><div id="ovText"></div></div>
<script src="game.js"></script>
</body>
</html>
