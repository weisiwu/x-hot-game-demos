<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>草堆寻针 Haystack Hunt</title>
<link rel="stylesheet" href="../../shared/xg.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #2b2116; color: #f6ead2; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  #hud { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; justify-content: center; padding: 8px 120px 6px 8px; font-size: 14px; width: 100%; }
  #hud b { color: #ffd68a; }
  #wrap { display: flex; gap: 10px; align-items: flex-start; justify-content: center; flex-wrap: nowrap; padding: 0 6px 10px; }
  @media (orientation: portrait) { #wrap { flex-wrap: wrap; } }
  canvas { background: #5a4329; border-radius: 12px; cursor: crosshair; touch-action: none; box-shadow: 0 8px 30px #0008; }
  #side { width: 230px; background: #3a2c1d; padding: 10px; border-radius: 12px; font-size: 13px; }
  #side button { width: 100%; margin: 3px 0; padding: 8px; border: 0; border-radius: 8px; background: #d9a441; color: #2b2116; font-weight: 800; cursor: pointer; font-size: 13px; }
  #side button:disabled { background: #6b5a40; color: #b9a98a; cursor: not-allowed; }
  #meter { height: 12px; background: #221a10; border-radius: 6px; overflow: hidden; margin: 4px 0 8px; }
  #meterFill { height: 100%; width: 0; background: linear-gradient(90deg, #4aa3ff, #ff4a4a); }
  #msg { min-height: 36px; color: #ffd68a; margin-top: 6px; line-height: 1.4; }
  @media (orientation: portrait) { #side { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; } #side .full { grid-column: 1 / -1; } }
  @media (orientation: landscape) and (max-height: 560px) { #side { width: 170px; padding: 6px; font-size: 12px; margin-top: 22px; } #side button { padding: 5px; font-size: 11px; } #msg { font-size: 11px; } #hud { padding: 4px 150px 2px 6px; font-size: 12px; } }
</style>
</head>
<body>
<div id="hud"><span>🌾 第 <b id="lvl">1</b> 堆</span><span>🪡 <b id="found">0/1</b></span><span>⏱ <b id="time">0:00</b></span><span>🪙 <b id="coins">0</b></span><span>🧲 <b id="mag">0</b></span></div>
<div id="wrap">
  <canvas id="c" width="900" height="560"></canvas>
  <div id="side">
    <div class="full" id="detWrap" style="display:none">📡 金属探测器<div id="meter"><div id="meterFill"></div></div></div>
    <button id="bRadius"></button>
    <button id="bPower"></button>
    <button id="bDetector"></button>
    <button id="bMagnet"></button>
    <button id="bUseMagnet" class="full"></button>
    <div id="msg" class="full"></div>
  </div>
</div>
<script src="../../shared/xg.js"></script>
<script src="game.js"></script>
</body>
</html>
