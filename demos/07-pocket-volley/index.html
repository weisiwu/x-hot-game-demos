<h1>🏐 口袋排球 Pocket Volley</h1>
<div class="sub">左边是你：<kbd>A</kbd><kbd>D</kbd> 移动，<kbd>W</kbd> 跳跃，空中靠近球按 <kbd>S</kbd> 扣球。每边最多碰 3 次，球落在对方场地得分，先到 <b>7 分</b>获胜。按 <kbd>2</kbd> 切换本地双人（右边用 <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd>）。</div>
