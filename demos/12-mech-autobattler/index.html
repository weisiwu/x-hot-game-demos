<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>机甲布阵 Mech Formation</title>
<link rel="stylesheet" href="../../shared/xg.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(circle at 50% 0, #1f2a38, #0b0f15 70%); color: #e7edf3; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  #wrap { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: flex-start; padding: 50px 6px 10px; }
  canvas { border-radius: 12px; cursor: pointer; touch-action: none; display: block; box-shadow: 0 8px 30px #0009; }
  #side { width: 270px; background: #1b232cdd; border-radius: 12px; padding: 10px; font-size: 13px; }
  .row { display: flex; justify-content: space-between; margin: 2px 0; }
  .row b { color: #ffcc4d; }
  #shop { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 6px; }
  button { padding: 6px; border: 0; border-radius: 8px; background: #2d3b48; color: #e7edf3; cursor: pointer; font-size: 12px; text-align: left; touch-action: manipulation; display: flex; gap: 6px; align-items: center; }
  button img { width: 34px; height: 34px; border-radius: 8px; flex: none; }
  button.sel { outline: 2px solid #ffcc4d; background: #3b4d5e; }
  button.go { background: #ffcc4d; color: #222; font-weight: 800; justify-content: center; font-size: 15px; width: 100%; margin-top: 6px; padding: 10px; }
  button.wide { width: 100%; margin-top: 4px; justify-content: center; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #syn { font-size: 12px; line-height: 1.6; margin-top: 6px; color: #9fd0ff; min-height: 20px; }
  #log { font-size: 12px; min-height: 34px; color: #ffcc4d; margin-top: 6px; line-height: 1.4; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="560" height="560"></canvas>
  <div id="side">
    <div class="row"><span>波次</span><b id="wave"></b></div>
    <div class="row"><span>💰 能源</span><b id="gold"></b></div>
    <div class="row"><span>🏰 基地耐久</span><b id="hp"></b></div>
    <div class="row"><span>部署上限</span><b id="cap"></b></div>
    <div id="shop"></div>
    <div id="syn"></div>
    <button id="bSell" class="wide">♻️ 回收模式（返还 70%）</button>
    <button id="bSpeed" class="wide">⏩ 战斗速度 ×1</button>
    <button id="bGo" class="go">⚔️ 开战</button>
    <div id="log"></div>
  </div>
</div>
<script src="../../shared/xg.js"></script>
<script src="game.js"></script>
</body>
</html>
