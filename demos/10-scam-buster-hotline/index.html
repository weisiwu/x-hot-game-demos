<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>反诈拖延热线 Scam Buster Hotline</title>
<link rel="stylesheet" href="../../shared/xg.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(circle at 50% 0, #1d3345, #0c1218 70%); color: #e9f0f5; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; min-height: 100vh; }
  .wrap { max-width: 860px; margin: auto; padding: 50px 10px 14px; }
  .bar { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 8px; }
  .chip { background: #1f2a33; padding: 5px 10px; border-radius: 8px; font-size: 13px; }
  .chip b { color: #6fe3a5; }
  #phone { background: #1a2229; border-radius: 16px; padding: 12px; min-height: 360px; box-shadow: 0 10px 30px #0008; }
  #caller { display: flex; gap: 12px; align-items: center; border-bottom: 1px solid #ffffff18; padding-bottom: 8px; margin-bottom: 8px; }
  #avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: #2c3a46; flex: none; }
  #cInfo { flex: 1; min-width: 0; }
  #pat { width: 150px; height: 10px; background: #000; border-radius: 5px; overflow: hidden; }
  #patFill { height: 100%; background: linear-gradient(90deg, #ff5d5d, #ffc94d); width: 100%; transition: width .3s; }
  #timer { font-family: ui-monospace, monospace; color: #6fe3a5; font-size: 13px; }
  #chat { max-height: 260px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 4px; }
  .msg { padding: 8px 12px; border-radius: 12px; max-width: 82%; font-size: 14px; line-height: 1.45; }
  .them { background: #3a2530; align-self: flex-start; }
  .me { background: #23443a; align-self: flex-end; }
  .sys { align-self: center; font-size: 12px; opacity: .75; text-align: center; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: #000; margin-left: 6px; opacity: .85; }
  #opts { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  #opts button, #keypad button { padding: 10px 12px; border: 0; border-radius: 10px; background: #2c3a46; color: #e9f0f5; cursor: pointer; text-align: left; font-size: 14px; touch-action: manipulation; }
  #opts button:hover { background: #38505f; }
  #opts button.primary { background: #6fe3a5; color: #102018; font-weight: 800; text-align: center; }
  #opts button.bait { background: #3b2222; }
  #opts button.hold { background: #2b3b5a; }
  #keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 260px; margin: 8px auto; }
  #keypad button { text-align: center; font-size: 20px; font-weight: 800; }
  #quiz label { display: inline-block; margin: 4px 10px 4px 0; font-size: 14px; }
  .meter { height: 12px; background: #000; border-radius: 6px; overflow: hidden; margin: 6px 0; }
  .meter div { height: 100%; background: #6fe3a5; width: 0; }
  #ring { text-align: center; padding: 30px 0; }
  #ring .big { font-size: 56px; animation: shake .4s infinite; display: inline-block; }
  @keyframes shake { 0%, 100% { transform: rotate(-12deg) } 50% { transform: rotate(12deg) } }
  .foot { font-size: 12px; opacity: .7; margin-top: 10px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <div class="chip">班次 <b id="shiftName"></b></div>
    <div class="chip">电话 <b id="callNo"></b></div>
    <div class="chip">拖住 <b id="mins"></b></div>
    <div class="chip">识别/反问 <b id="flags"></b></div>
    <div class="chip">总分 <b id="total"></b> / <b id="goal"></b></div>
    <div class="chip">泄露 <b id="leaks"></b> / 2</div>
  </div>
  <div id="phone">
    <div id="caller"><img id="avatar" alt=""><div id="cInfo"><b id="cName">等待来电…</b><div style="font-size:12px;opacity:.7" id="cNum"></div><div id="timer"></div></div><div><div style="font-size:12px;opacity:.7">骗子耐心</div><div id="pat"><div id="patFill"></div></div></div></div>
    <div id="chat"></div>
    <div id="opts"></div>
  </div>
  <div class="foot">本游戏内容纯属虚构，用于反诈科普。现实中遇到可疑来电请直接挂断，并拨打当地反诈热线（中国大陆：96110）。</div>
</div>
<script src="../../shared/xg.js"></script>
<script src="scripts.js"></script>
<script src="game.js"></script>
</body>
</html>
