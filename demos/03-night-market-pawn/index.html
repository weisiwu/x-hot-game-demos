<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>夜市旧货摊 Night Market Pawn</title>
<link rel="stylesheet" href="../../shared/xg.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(circle at 50% 0, #3b1253, #0d0518 70%); color: #eadcff; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; min-height: 100vh; }
  header { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; padding: 10px 200px 6px 12px; font-size: 14px; }
  header b { color: #ffd27a; }
  main { display: grid; grid-template-columns: 1.25fr 1fr 1fr; gap: 10px; padding: 6px 10px 12px; max-width: 1120px; margin: auto; }
  .panel { background: #1b0d30cc; border: 1px solid #ff2fa055; border-radius: 12px; padding: 10px; box-shadow: 0 0 14px #ff2fa022 inset; }
  .panel h3 { margin: 0 0 6px; color: #ff7ad1; font-size: 14px; }
  #cEmoji { font-size: 54px; text-align: center; line-height: 1.1; }
  #cType { text-align: center; font-size: 12px; color: #3ce0ff; min-height: 16px; }
  #cSay { background: #2c1650; border-radius: 10px; padding: 8px 10px; margin: 6px 0; min-height: 44px; font-size: 14px; line-height: 1.5; }
  .row { display: flex; justify-content: space-between; margin: 2px 0; font-size: 13px; gap: 8px; }
  .row b { text-align: right; }
  .serial { font-family: ui-monospace, Consolas, monospace; color: #7dfcff; letter-spacing: 1px; }
  .clue { color: #ffb86b; font-size: 12px; min-height: 16px; }
  button { padding: 8px 10px; border: 0; border-radius: 8px; background: #ff2fa0; color: #fff; font-weight: 800; cursor: pointer; margin: 2px; font-size: 13px; touch-action: manipulation; }
  button.alt { background: #4b2c80; }
  button.warn { background: #c0392b; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  #offer { font-size: 28px; text-align: center; margin: 4px 0; color: #7dfcff; font-weight: 800; }
  .btnrow { display: flex; flex-wrap: wrap; justify-content: center; }
  #log { font-size: 12px; max-height: 150px; overflow: auto; }
  #log div { border-bottom: 1px dashed #ffffff18; padding: 2px 0; }
  ul { margin: 0; padding-left: 16px; font-size: 12px; line-height: 1.6; }
  #inv li { cursor: default; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr 1fr; } main .panel:first-child { grid-row: span 2; } header { padding-right: 180px; font-size: 12px; } }
  @media (max-width: 560px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><span>🌙 第 <b id="night">1</b>/7 夜</span><span>💰 <b id="money">0</b></span><span>🏠 摊位费 <b id="rent">0</b></span><span>👥 剩 <b id="remain">0</b></span><span>⭐ 声誉 <b id="rep">50</b></span><span>🚨 <b id="heat"></b></span></header>
<main>
  <section class="panel">
    <h3 id="custTitle">顾客</h3>
    <div id="cEmoji">⏳</div>
    <div id="cType"></div>
    <div id="cSay">……</div>
    <div class="row"><span>物品</span><b id="cItem">—</b></div>
    <div class="row"><span>序列号</span><b class="serial" id="cSerial">—</b></div>
    <div class="row"><span>成色</span><b id="cCond">—</b></div>
    <div class="clue" id="cClue"></div>
    <div class="row"><span id="askLabel">要价</span><b id="cAsk">—</b></div>
    <div class="row"><span>耐心</span><b id="cPat">—</b></div>
    <div id="offer">$0</div>
    <div class="btnrow">
      <button class="alt" data-d="-50">-50</button><button class="alt" data-d="-10">-10</button><button class="alt" data-d="10">+10</button><button class="alt" data-d="50">+50</button>
    </div>
    <div class="btnrow">
      <button id="bOffer">💬 出价 / 报价</button>
      <button id="bScan" class="alt">🔍 扫描</button>
      <button id="bReject" class="alt">🚪 请走</button>
      <button id="bReport" class="warn">📢 举报赃物</button>
    </div>
  </section>
  <section class="panel">
    <h3>📋 今晚失窃登记序列号</h3>
    <ul id="hot"></ul>
    <h3 style="margin-top:8px">📖 市场参考价（全新正品）</h3>
    <ul id="guide"></ul>
  </section>
  <section class="panel">
    <h3>📦 库存（等买家来买）</h3>
    <ul id="inv"></ul>
    <h3 style="margin-top:8px">📝 日志</h3>
    <div id="log"></div>
  </section>
</main>
<script src="../../shared/xg.js"></script>
<script src="game.js"></script>
</body>
</html>
