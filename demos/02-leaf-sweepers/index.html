<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>落叶清扫队 Leaf Sweepers</title>
<link rel="stylesheet" href="../../shared/xg.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #14200f; color: #eef5e6; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
  #top { height: 6px; }
  canvas { border-radius: 12px; touch-action: none; box-shadow: 0 8px 30px #0008; display: block; }
  #shop { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; margin: 6px 0; max-width: 900px; padding: 0 6px; }
  #shop button { padding: 6px 9px; border: 0; border-radius: 8px; background: #e0913a; color: #1d1206; font-weight: 800; cursor: pointer; font-size: 12px; line-height: 1.25; }
  #shop button small { display: block; font-weight: 600; opacity: .85; }
  #shop button:disabled { background: #3b4a33; color: #93a389; cursor: not-allowed; }
</style>
</head>
<body>
<div id="top"></div>
<canvas id="c" width="900" height="540"></canvas>
<div id="shop"></div>
<script src="../../shared/xg.js"></script>
<script src="game.js"></script>
</body>
</html>
